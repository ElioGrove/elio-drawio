<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的流程图 · Elio Draw</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/library/library.css">
<script src="/library/library.js" type="module"></script>
</head>
<body>
<header>
  <div><h1>我的流程图</h1><p>Elio Draw</p></div>
  <div class="toolbar">
    <a href="/">打开独立编辑器</a>
    <button id="import" disabled>导入文件</button>
    <input id="files" type="file" accept=".drawio,.xml" multiple hidden>
    <button id="new" class="primary" disabled>新建流程图</button>
  </div>
</header>
<main>
  <p id="notice" role="status">正在载入流程图…</p>
  <section id="library">
    <label for="search">搜索流程图</label>
    <input id="search" type="search" placeholder="按文件名搜索">
    <ul id="list"></ul>
  </section>
  <section id="workspace" hidden>
    <div class="editorbar">
      <button id="back">返回列表</button>
      <strong id="name"></strong>
      <span id="save-status" role="status"></span>
      <label><input id="auto" type="checkbox"> 自动同步</label>
      <button id="download" disabled>下载副本</button>
      <button id="save" class="primary" disabled>手动保存</button>
    </div>
    <div id="editor"></div>
  </section>
</main>
</body>
</html>
